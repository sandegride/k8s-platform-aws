deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: platform-dev-loki-chunks
      ruler: platform-dev-loki-ruler
    s3:
      region: eu-central-1
  limits_config:
    retention_period: 168h
  compactor:
    retention_enabled: true
    delete_request_store: s3

singleBinary:
  replicas: 1
  persistence:
    storageClass: gp3
    size: 20Gi

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

chunksCache:
  enabled: false
resultsCache:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
